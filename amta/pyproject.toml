[project]
name = "amta"
version = "0.1.0"
description = "AMTA — Automation Manga Translate Agent：本地 koharu v0.59.1 headless 驱动的漫画翻译自动化编排层"
requires-python = ">=3.12"

# ---- 运行时依赖（vibe-check 拦截后的最小集，ADR-015）----
# 铁律：能原生/标准库实现就不加依赖。加任何依赖前先跑 `uv run depguard` 审视。
# requests / pillow 是全仓真正 import 到的第三方库（requests: koharu_client/ocr_engines/translate；
# pillow: images/baberu_ocr）。其余一律标准库。
# numpy: report/ 图层叠加 + gen_stage4_report（mask 数组运算），两路 OCR 取舍都离不开。
dependencies = [
    "requests==2.34.2",
    "pillow==12.3.0",
    "numpy==2.5.2",
    # hayai_ocr: 02_ocr 默认 OCR 引擎（HayaiOCR-v2.1，SigLIP2+transformer，PyTorch）。
    # manga_ocr(kha-white) 曾接线但包未装、属半截集成，已摘除（2026-09-03）。
    "hayai-ocr==2.1.0",
    # opencv-python(cv2): src/amta/text_mask_refiner.py 框内文字像素精修（04_inpaint 模块级 import），Stage4 Plan A 必需。
    "opencv-python==5.0.0.93",
    # torch + safetensors: lama-manga 本地 inpainting 实验功能（_lama_ffc/_lama_model/_lama_util/local_lama_inpainter，
    # FFCResNetGenerator 前向 + .safetensors 权重加载）。torch 已由 hayai-ocr 传递安装，直声明仅为 depguard 显式化
    # （本地 CPU-only i5，非新增重量运行时）；safetensors 无 stdlib 替代，加载 lama 权重必需（ADR-015 审视通过）。
    "torch==2.14.0",
    "safetensors==0.8.0",
    "claude-agent-sdk>=0.2.152",
]

[tool.uv]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
# 严格解析：锁定最小传递依赖，禁止意外引入未声明包。
# 工具链（ruff/pyright/pytest）不在 uv 管理内，走全局安装（ADR-004/ADR-015）。

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["scripts/probes/**", "research/reference-repos/**", "models/**", "output/**"]

[tool.ruff.lint]
# E701/E702（单行多条语句）是项目既有紧凑风格，忽略；其余规则保留。
# BLE001/S110：盲 except 与 try-except-pass 是本项目的容错纪律（ADR-025 注入纪律：地产异常降级不阻塞，
# CLI/hook 层故意宽松）——豁免而非逐处撒 noqa（2026-09-10 治理定案）。
# PLW1510：subprocess 不带 check 是 CLI 层故意的容错（失败不炸，fastcheck 自己兜底）。
ignore = ["E701", "E702", "BLE001", "S110", "PLW1510", "TRY004", "TRY002"]

[tool.ruff.lint.per-file-ignores]
# 外部模型目录的运行时动态导入（models/ 不入库，克隆环境不存在）
"scripts/baberu_ocr.py" = ["E402"]
# CLI/脚本层日志时间戳用本地时间是有意的（人读），豁免时区规则
"scripts/**" = ["E402", "DTZ", "BLE001", "S110", "PLW1510"]
# 测试层：假实现/宽松断言里的同类豁免
"tests/**" = ["E402", "DTZ", "BLE001", "S110"]
# lama 三件套移植自参考实现（L38：预处理/后处理与参考完全对齐），默认参数构造保持原样
"src/amta/inpaint/_lama*.py" = ["B008"]
# memory 系统按本地日期运转（today-*.md 文件名即本地日期），故意 naive datetime
"src/amta/memory/**" = ["DTZ"]

[tool.pyright]
pythonVersion = "3.11"
# 外部模型目录（models/）不入库，排除避免误报
exclude = ["models/**", "output/**", "scripts/probes/**", "research/reference-repos/**"]

[tool.pytest.ini_options]
# memory_* 测试的 import 通路：amta 包 + tests 跨文件 fixture 复用（ADR-025 前置）
pythonpath = ["src", "."]
# 只收集 tests/：仓库里散落着 output/archive_86era、reference/_vendor 等历史/外部测试，
# 全仓扫描会拖慢收集并产生 import 报错（2026-09-07 第二波清理时暴露）
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
